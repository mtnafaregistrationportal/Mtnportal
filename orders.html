<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">

    <style>
        /* ============================================
           iOS 26 LIQUID GLASS DESIGN SYSTEM
           ============================================ */
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-bg-strong: rgba(255, 255, 255, 0.12);
            --glass-bg-hover: rgba(255, 255, 255, 0.16);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-border-light: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --glass-shadow: rgba(0, 0, 0, 0.15);
            --glass-shadow-strong: rgba(0, 0, 0, 0.25);
            
            --primary-yellow: #FFD700;
            --primary-yellow-glow: rgba(255, 215, 0, 0.3);
            --accent-blue: #5AC8FA;
            --accent-green: #34C759;
            --accent-red: #FF3B30;
            --accent-orange: #FF9500;
            --accent-purple: #AF52DE;
            
            --text-white: #ffffff;
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.45);
            --text-dark: #1a1a1a;
            
            --bg-deep: #0a0f1a;
            --bg-gradient-start: #0a0f1a;
            --bg-gradient-mid: #0d1b2a;
            --bg-gradient-end: #0a1520;
            
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --radius-xl: 36px;
            --radius-full: 9999px;
            
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(255, 215, 0, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(90, 200, 250, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(175, 82, 222, 0.02) 0%, transparent 50%);
            animation: meshMove 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes meshMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, 2%) rotate(1deg); }
            66% { transform: translate(-1%, 1%) rotate(-1deg); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }
        
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 var(--primary-yellow-glow); }
            50% { box-shadow: 0 0 20px 4px var(--primary-yellow-glow); }
        }
        
        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
        
        @keyframes colorShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ============================================
           EXISTING CODE - LIQUID GLASS UPGRADED
           ============================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(160deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 40%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 100px;
            position: relative;
        }
        
        /* Liquid Glass Fixed Header */
        .orders-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: rgba(10, 15, 26, 0.75);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-bottom: 1px solid var(--glass-border);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            height: 68px;
            transition: all var(--transition-smooth);
        }
        
        .orders-header.scrolled {
            background: rgba(10, 15, 26, 0.9);
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }
        
        /* Back Button */
        .back-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            backdrop-filter: blur(20px);
            transition: all var(--transition-fast);
        }
        .back-btn:hover {
            background: var(--glass-bg-hover);
            color: var(--primary-yellow);
            transform: translateX(-2px);
        }
        
        .orders-header-left { display: flex; align-items: center; gap: 12px; }
        
        /* Liquid Glass Orders Icon */
        .orders-icon {
            width: 40px; 
            height: 40px;
            background: linear-gradient(135deg, var(--primary-yellow), #FFA500);
            border-radius: 12px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            border: none;
            box-shadow: 0 4px 16px rgba(255, 215, 0, 0.3);
            transition: all var(--transition-fast);
        }
        .orders-icon:hover {
            transform: scale(1.08) rotate(-3deg);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }
        .orders-icon svg { width: 20px; height: 20px; color: var(--text-dark); }
        
        .orders-header-text h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
        
        /* Content scrolls behind fixed header */
        .orders-content { 
            padding: 88px 20px 40px; 
            max-width: 480px; 
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        .section-title { 
            font-size: 28px; 
            font-weight: 800; 
            margin-bottom: 20px; 
            letter-spacing: -1px;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.2);
            animation: fadeInUp 0.5s var(--transition-smooth);
        }
        
        /* Liquid Glass Stats Row */
        .stats-row { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 14px; 
            margin-bottom: 24px; 
        }
        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 20px 10px;
            text-align: center;
            box-shadow: 0 8px 32px var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.5s var(--transition-smooth) backwards;
        }
        .stat-card:nth-child(1) { animation-delay: 0.05s; }
        .stat-card:nth-child(2) { animation-delay: 0.1s; }
        .stat-card:nth-child(3) { animation-delay: 0.15s; }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-highlight), transparent);
            opacity: 0.6;
        }
        .stat-card:hover {
            background: var(--glass-bg-hover);
            transform: translateY(-3px);
            box-shadow: 0 16px 48px var(--glass-shadow-strong), inset 0 1px 0 var(--glass-highlight);
        }
        .stat-value { 
            font-size: 28px; 
            font-weight: 800; 
            color: var(--primary-yellow); 
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
            transition: all var(--transition-fast);
        }
        .stat-card:hover .stat-value {
            transform: scale(1.1);
        }
        .stat-label { 
            font-size: 11px; 
            color: var(--text-muted); 
            margin-top: 6px; 
            text-transform: uppercase; 
            letter-spacing: 0.8px; 
            font-weight: 700;
        }
        
        /* Empty State */
        .empty-state { 
            text-align: center; 
            padding: 60px 20px; 
            color: var(--text-muted); 
            animation: fadeInUp 0.5s var(--transition-smooth);
        }
        .empty-state svg { 
            width: 64px; 
            height: 64px; 
            margin-bottom: 16px; 
            opacity: 0.5; 
        }
        
        /* Liquid Glass Order Card */
        .order-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 24px 20px;
            margin-bottom: 14px;
            box-shadow: 0 8px 32px var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
            animation: slideInRight 0.4s var(--transition-smooth) backwards;
        }
        .order-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-highlight), transparent);
            opacity: 0.6;
        }
        .order-card:hover {
            background: var(--glass-bg-hover);
            transform: translateY(-2px);
            box-shadow: 0 16px 48px var(--glass-shadow-strong), inset 0 1px 0 var(--glass-highlight);
        }
        .order-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 14px; 
        }
        .order-id { 
            font-size: 12px; 
            color: var(--text-muted); 
            font-family: monospace; 
            font-weight: 600;
        }
        
        /* Liquid Glass Status Badges */
        .order-status {
            padding: 6px 16px;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
            backdrop-filter: blur(10px);
            transition: all var(--transition-fast);
        }
        .status-pending { 
            background: rgba(255, 152, 0, 0.15); 
            color: var(--accent-orange); 
            border: 1px solid rgba(255, 152, 0, 0.25);
        }
        .status-processing { 
            background: rgba(90, 200, 250, 0.15); 
            color: var(--accent-blue); 
            border: 1px solid rgba(90, 200, 250, 0.25);
        }
        .status-approved { 
            background: rgba(52, 199, 89, 0.15); 
            color: var(--accent-green); 
            border: 1px solid rgba(52, 199, 89, 0.25);
        }
        .status-rejected { 
            background: rgba(255, 59, 48, 0.15); 
            color: var(--accent-red); 
            border: 1px solid rgba(255, 59, 48, 0.25);
        }
        .status-paid { 
            background: rgba(255, 215, 0, 0.15); 
            color: var(--primary-yellow); 
            border: 1px solid rgba(255, 215, 0, 0.25);
        }
        .status-failed { 
            background: rgba(255, 59, 48, 0.15); 
            color: var(--accent-red); 
            border: 1px solid rgba(255, 59, 48, 0.25);
        }
        
        .order-details { 
            border-top: 1px solid rgba(255,255,255,0.1); 
            padding-top: 14px; 
        }
        .detail-row { 
            display: flex; 
            justify-content: space-between; 
            padding: 8px 0; 
            font-size: 13px; 
            transition: all var(--transition-fast);
        }
        .detail-row:hover {
            padding-left: 4px;
            padding-right: 4px;
        }
        .detail-label { 
            color: var(--text-muted); 
            font-weight: 500;
        }
        .detail-value { 
            font-weight: 700; 
            color: var(--text-primary);
        }
        
        /* Liquid Glass Admin Notes */
        .admin-note {
            background: rgba(255, 152, 0, 0.12);
            border: 1px solid rgba(255, 152, 0, 0.25);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            margin-top: 14px;
            font-size: 12px;
            font-weight: 500;
            backdrop-filter: blur(10px);
            transition: all var(--transition-fast);
        }
        .admin-note.rejected { 
            background: rgba(255, 59, 48, 0.12); 
            border-color: rgba(255, 59, 48, 0.25); 
            color: var(--accent-red); 
        }
        .admin-note.approved { 
            background: rgba(52, 199, 89, 0.12); 
            border-color: rgba(52, 199, 89, 0.25); 
            color: var(--accent-green); 
        }
        .admin-note.failed { 
            background: rgba(255, 59, 48, 0.12); 
            border-color: rgba(255, 59, 48, 0.25); 
            color: var(--accent-red); 
        }
        .admin-note.paid { 
            background: rgba(255, 215, 0, 0.12); 
            border-color: rgba(255, 215, 0, 0.25); 
            color: var(--primary-yellow); 
        }
        
        /* ============================================
           CONTACT SUPPORT BUTTON - FIXED
           Green > Black > Gold shifting continuously
           ============================================ */
        .contact-support-btn {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #22c55e, #000000, #FFD700, #22c55e);
            background-size: 300% 100%;
            animation: colorShift 4.8s ease infinite;
            border-radius: var(--radius-full);
            padding: 14px 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 200;
            text-decoration: none;
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            transition: all var(--transition-fast);
            white-space: nowrap;
            line-height: 1;
        }
        .contact-support-btn:hover {
            transform: translateX(-50%) translateY(-2px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }
        .contact-support-btn svg {
            width: 20px;
            height: 20px;
            color: white;
            flex-shrink: 0;
            display: block;
        }
        .contact-support-text {
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            white-space: nowrap;
            line-height: 1;
            display: block;
        }
        
        /* Loading Spinner */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            flex-direction: column;
            gap: 16px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(255,215,0,0.2);
            border-top-color: var(--primary-yellow);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }
        
        /* Delete Order Button */
        .btn-delete-order {
            margin-top: 14px;
            width: 100%;
            padding: 12px;
            background: rgba(255, 59, 48, 0.12);
            border: 1px solid rgba(255, 59, 48, 0.25);
            color: var(--accent-red);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all var(--transition-fast);
            backdrop-filter: blur(10px);
            letter-spacing: 0.3px;
        }
        .btn-delete-order:hover {
            background: rgba(255, 59, 48, 0.2);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(255, 59, 48, 0.2);
        }
        .btn-delete-order:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-delete-order:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Liquid Glass Toast */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(100px) scale(0.9);
            padding: 16px 24px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            z-index: 1001;
            opacity: 0;
            transition: all 0.4s var(--transition-spring);
            white-space: nowrap;
            backdrop-filter: blur(40px) saturate(180%);
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            max-width: 400px;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0) scale(1);
        }
        .toast-success { 
            background: rgba(52, 199, 89, 0.9); 
            color: white; 
        }
        .toast-error { 
            background: rgba(255, 59, 48, 0.9); 
            color: white; 
        }
        
        @media (min-width: 768px) { 
            .orders-content { max-width: 720px; padding: 96px 24px 40px; }
            .orders-header { padding: 20px 32px; height: 72px; }
            .orders-content { padding-top: 96px; }
        }
        
        @media (min-width: 1024px) {
            .orders-header { padding: 24px 48px; height: 76px; }
            .orders-content { padding: 104px 24px 40px; }
        }

        .retry-payment-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(10, 15, 26, 0.72);
            backdrop-filter: blur(20px) saturate(130%);
            -webkit-backdrop-filter: blur(20px) saturate(130%);
        }
        .retry-payment-modal.active { display: flex; }
        .retry-payment-content {
            width: min(520px, 100%);
            height: min(82vh, 700px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #fff;
            border-radius: var(--radius-lg);
            box-shadow: 0 24px 80px rgba(0,0,0,.55);
        }
        .retry-payment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 18px;
            background: linear-gradient(135deg, var(--primary-yellow), #FFA500);
            color: var(--text-dark);
        }
        .retry-payment-title { font-size: 15px; font-weight: 800; }
        .retry-payment-close {

        }

        .retry-payment-footer {
            display: flex;

            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            background: #f8f9fa;
            border-top: 1px solid rgba(0,0,0,.08);
        }

            border: 0;

        }
        .retry-payment-verify:disabled { opacity: .55; cursor: not-allowed; }

            .retry-payment-content { height: 86vh; }
            .retry-payment-footer { align-items: stretch; flex-direction: column; }
            .retry-payment-verify { width: 100%; }
        }
        .delete-confirm-modal {
            display: none; position: fixed; inset: 0; z-index: 2100; align-items: center; justify-content: center;
            padding: 20px; background: rgba(10, 15, 26, .72); backdrop-filter: blur(20px) saturate(130%);
            -webkit-backdrop-filter: blur(20px) saturate(130%);
        }
        .delete-confirm-modal.active { display: flex; }
        .delete-confirm-card {
            width: min(430px, 100%); background: rgba(23, 31, 45, .96); color: var(--text-primary);
            border: 1px solid rgba(255,255,255,.16); border-radius: var(--radius-lg); padding: 24px;
            box-shadow: 0 24px 80px rgba(0,0,0,.55); text-align: center;
        }
        .delete-confirm-title { font-size: 19px; font-weight: 800; margin-bottom: 10px; }
        .delete-confirm-message { color: var(--text-secondary); font-size: 14px; line-height: 1.55; margin-bottom: 20px; }
        .delete-confirm-actions { display: flex; gap: 10px; }
        .delete-confirm-actions button { flex: 1; padding: 12px; border-radius: var(--radius-sm); font: inherit; font-weight: 800; cursor: pointer; }
        .delete-cancel-btn { background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16); color: var(--text-primary); }
        .delete-confirm-btn { background: linear-gradient(135deg, #ff3b30, #d92d26); border: 0; color: #fff; }
        @media (max-width: 480px) { .delete-confirm-actions { flex-direction: column-reverse; } }
        .order-edit-modal { display:none; position:fixed; inset:0; z-index:2050; align-items:center; justify-content:center; padding:16px; background:rgba(10,15,26,.72); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
        .order-edit-modal.active { display:flex; }
        .order-edit-card { width:min(520px,100%); max-height:90vh; overflow:auto; background:#fff; color:#1a1a1a; border-radius:var(--radius-lg); padding:22px; box-shadow:0 24px 80px rgba(0,0,0,.55); }
        .order-edit-title { font-size:19px; font-weight:800; margin-bottom:16px; }
        .order-edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    </style>
</head>

                <div><label for="editLastName">Last Name *</label><input id="editLastName" required></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="glass.js"></script>
    <script>
        // ============================================
        // FIXED: Use config.js getValidToken for auto-refresh
        // ============================================
        async function getAuthToken() {
            if (typeof getValidToken === 'function') {
                return await getValidToken();
            }
            const session = getSessionUnified();
            return session ? (session.access_token || session.token) : null;
        }

        // ============================================
        // FIXED: Async auth check with token refresh
        // ============================================
        async function isAuthenticatedOrders() {
            const token = await getAuthToken();
            const user = getUserUnified();
            return !!(token && user && user.id);
        }

        // ============================================
        // UNIFIED USER HELPERS (keep for compatibility)
        // ============================================
        function getUserUnified() {
            if (typeof getUser === 'function') {
                const user = getUser();
                if (user && user.id) return user;
            }
            if (typeof getCurrentUser === 'function') {
                const user = getCurrentUser();
                if (user && user.id) return user;
            }
            const afaUser = localStorage.getItem('afa_user');
            if (afaUser) {
                try { return JSON.parse(afaUser); } catch (e) {}
            }
            return {
                id: localStorage.getItem('userId'),
                name: localStorage.getItem('userName'),
                email: localStorage.getItem('userEmail'),
                phone: localStorage.getItem('userPhone'),
                profilePicture: localStorage.getItem('profilePicture') || localStorage.getItem('userProfilePicture')
            };
        }

        function getSessionUnified() {
            if (typeof getSession === 'function') {
                const session = getSession();
                if (session) return session;
            }
            const afaSession = localStorage.getItem('afa_session');
            if (afaSession) {
                try { return JSON.parse(afaSession); } catch (e) {}
            }
            return {
                access_token: localStorage.getItem('access_token') || localStorage.getItem('sb_token') || localStorage.getItem('token')
            };
        }

        // ============================================
        // FIXED: API CALL with token refresh
        // ============================================
        async function apiCallOrders(endpoint, method, body) {
            // Use config.js apiCall() if available (same as dashboard)
            if (typeof apiCall === 'function') {
                try {
                    return await apiCall(endpoint, method, body);
                } catch (e) {
                    console.log('config.js apiCall failed, using fallback:', e.message);
                }
            }

            // Fallback: direct fetch (same pattern as dashboard)
            const token = await getAuthToken();
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = 'Bearer ' + token;

            const response = await fetch(API_BASE + endpoint, {
                method: method || 'GET',
                headers: headers,
                body: body ? JSON.stringify(body) : null,
                credentials: 'include'
            });

            const data = await response.json();

            if (!data.success && (data.error?.includes('token') || data.error?.includes('Access denied') || data.error?.includes('Invalid or expired'))) {
                if (typeof clearSession === 'function') clearSession();
                window.location.href = 'signin.html';
                throw new Error(data.error || 'Session expired');
            }

            return data;
        }

        // ============================================
        // CONFIGURATION
        // ============================================
        const API_BASE = 'https://mtn-afa-api.onrender.com';

        // ============================================
        // TOAST NOTIFICATION
        // ============================================
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast toast-' + (type || 'success');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        let retryPaymentState = { orderId: null, reference: null, verifying: false };
        let deleteConfirmResolver = null;
        let editingOrder = null;

        function splitApplicantName(name) {
            const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
            return { firstName: parts.shift() || '', lastName: parts.join(' ') || '' };
        }

        function openOrderEditModal(orderId) {
            const order = allOrders.find(item => String(item.id) === String(orderId));
            if (!order) return showToast('Order not found', 'error');
            editingOrder = order;
            const name = splitApplicantName(order.applicant_name);
            document.getElementById('editOrderId').value = order.id;
            document.getElementById('editFirstName').value = name.firstName;
            document.getElementById('editLastName').value = name.lastName;
            document.getElementById('editPhone').value = order.applicant_phone || '';
            document.getElementById('editEmail').value = order.applicant_email || '';
            document.getElementById('editIdNumber').value = order.id_number || '';
            document.getElementById('editLocation').value = order.location || '';
            document.getElementById('editDob').value = order.dob || '';
            document.getElementById('editOccupation').value = order.occupation || '';
            document.getElementById('orderEditModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('editFirstName').focus();
        }

        function closeOrderEditModal() {
            document.getElementById('orderEditModal')?.classList.remove('active');
            document.body.style.overflow = retryPaymentState.orderId ? 'hidden' : '';
            editingOrder = null;
        }

        document.getElementById('orderEditForm')?.addEventListener('submit', async event => {
            event.preventDefault();
            const save = document.getElementById('orderEditSave');
            const payload = { userId: getUserUnified().id, orderId: document.getElementById('editOrderId').value,
                firstName: document.getElementById('editFirstName').value.trim(), lastName: document.getElementById('editLastName').value.trim(),
                phone: document.getElementById('editPhone').value.trim(), email: document.getElementById('editEmail').value.trim(),
                idNumber: document.getElementById('editIdNumber').value.trim().toUpperCase(), location: document.getElementById('editLocation').value.trim(),
                dob: document.getElementById('editDob').value.trim(), occupation: document.getElementById('editOccupation').value.trim() };
            if (!payload.firstName || !payload.lastName || !payload.phone || !payload.email || !payload.idNumber || !payload.location || !payload.dob || !payload.occupation) return showToast('Please fill in all required fields', 'error');
            if (!/^\d{10}$/.test(payload.phone) || !/^GHA-\d{9}-\d$/.test(payload.idNumber)) return showToast('Check the phone and Ghana Card formats', 'error');
            save.disabled = true; save.textContent = 'Saving...';
            try {
                const data = await apiCallOrders('/api/user/update-order', 'POST', payload);
                if (!data.success) throw new Error(data.error || 'Unable to update order');
                closeOrderEditModal();
                showToast(data.paymentRequired ? 'Details saved. Complete payment.' : 'Order details updated', 'success');
                if (data.paymentRequired && data.paymentLink && data.reference) {
                    retryPaymentState = { orderId: String(payload.orderId), reference: data.reference, verifying: false };
                    document.getElementById('retryPaymentIframe').src = data.paymentLink;
                    document.getElementById('retryPaymentStatus').textContent = 'GH₵ 15.45 · Complete payment, then tap I\'ve Paid.';
                    document.getElementById('retryPaymentModal').classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
                await initOrders();
            } catch (error) { showToast(error.message || 'Unable to update order', 'error'); }
            finally { save.disabled = false; save.textContent = 'Save Changes'; }
        });

        function askDeleteConfirmation() {
            const modal = document.getElementById('deleteConfirmModal');
            if (!modal) return Promise.resolve(false);
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            return new Promise(resolve => { deleteConfirmResolver = resolve; });
        }

        function closeDeleteConfirm(confirmed) {
            const modal = document.getElementById('deleteConfirmModal');
            if (modal) modal.classList.remove('active');
            document.body.style.overflow = retryPaymentState.orderId ? 'hidden' : '';
            if (deleteConfirmResolver) {
                const resolve = deleteConfirmResolver;
                deleteConfirmResolver = null;
                resolve(confirmed === true);
            }
        }

        async function proceedToPayment(orderId, button) {
            if (button?.disabled) return;
            if (button) { button.disabled = true; button.textContent = 'Opening Payment...'; }
            try {
                const data = await apiCallOrders('/api/payment/retry', 'POST', { orderId });
                if (!data.success || !data.paymentLink || !data.reference) throw new Error(data.error || 'Payment link not received.');
                retryPaymentState = { orderId: String(orderId), reference: data.reference, verifying: false };
                document.getElementById('retryPaymentIframe').src = data.paymentLink;
                document.getElementById('retryPaymentStatus').textContent = 'GH₵ 15.45 · Complete payment, then tap I\'ve Paid.';
                document.getElementById('retryPaymentVerify').disabled = false;
                document.getElementById('retryPaymentModal').classList.add('active');
                document.body.style.overflow = 'hidden';
            } catch (error) {
                showToast(error.message || 'Unable to open payment. Please try again.', 'error');
            } finally {
                if (button) { button.disabled = false; button.textContent = 'Proceed to Payment'; }
            }
        }

        function closeRetryPaymentModal() {
            const modal = document.getElementById('retryPaymentModal');
            const iframe = document.getElementById('retryPaymentIframe');
            const verifyButton = document.getElementById('retryPaymentVerify');
            if (modal) modal.classList.remove('active');
            if (iframe) iframe.src = '';
            if (verifyButton) { verifyButton.disabled = false; verifyButton.textContent = 'I\'ve Paid'; }
            retryPaymentState = { orderId: null, reference: null, verifying: false };
            document.body.style.overflow = '';
        }

        async function verifyRetryPayment() {
            if (retryPaymentState.verifying || !retryPaymentState.reference) return;
            retryPaymentState.verifying = true;
            const button = document.getElementById('retryPaymentVerify');
            const status = document.getElementById('retryPaymentStatus');
            if (button) { button.disabled = true; button.textContent = 'Checking...'; }
            if (status) status.textContent = 'Checking payment status...';
            try {
                const token = await getAuthToken();
                const response = await fetch(API_BASE + '/api/payment/verify?reference=' + encodeURIComponent(retryPaymentState.reference), {
                    method: 'GET', headers: token ? { Authorization: 'Bearer ' + token } : {}, credentials: 'include', cache: 'no-store'
                });
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.error || 'Unable to verify payment.');
                if (data.verified) {
                    closeRetryPaymentModal();
                    showToast('Payment verified successfully', 'success');
                    await initOrders();
                } else {
                    if (status) status.textContent = 'Payment not confirmed yet. Complete payment and try again.';
                    showToast('Payment is not confirmed yet', 'error');
                }
            } catch (error) {
                if (status) status.textContent = 'Unable to verify payment. Please try again.';
                showToast(error.message || 'Unable to verify payment.', 'error');
            } finally {
                retryPaymentState.verifying = false;
                if (button) { button.disabled = false; button.textContent = 'I\'ve Paid'; }
            }
        }

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && retryPaymentState.orderId) closeRetryPaymentModal();
            else if (event.key === 'Escape' && document.getElementById('deleteConfirmModal')?.classList.contains('active')) closeDeleteConfirm(false);
        });
        document.getElementById('deleteConfirmModal')?.addEventListener('click', event => {
            if (event.target.id === 'deleteConfirmModal') closeDeleteConfirm(false);
        });

        // ============================================
        // USER DELETE OWN ORDER
        // ============================================
        async function deleteUserOrder(orderId) {
            if (!(await askDeleteConfirmation())) return;
            const user = getUserUnified();
            const btn = document.getElementById('delete-btn-' + orderId);
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = 'Deleting...';
            }
            
            try {
                const data = await apiCallOrders('/api/user/delete-order', 'POST', {
                    userId: user.id,
                    orderId: orderId
                });
                
                if (data.success) {
                    showToast('Order removed from your dashboard', 'success');
                    await initOrders();
                } else {
                    throw new Error(data.error || 'Failed to delete order');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '🗑 Delete';
                }
            }
        }

        // ============================================
        // REMOVED: verifyPaymentWithBackend() 
        // Orders page NO LONGER verifies payments.
        // It only reads the status from the database.
        // Webhook + Cron handle all verification.
        // ============================================

        // ============================================
        // ORDER STATUS FROM DATABASE ONLY
        // No payment verification. Just reads existing status.
        // ============================================
        function getOrderDisplayStatus(order) {
            const status = order.status || 'pending';
            
            if (status === 'approved') {
                return {
                    badge: 'Completed',
                    badgeClass: 'status-approved',
                    noteClass: 'approved',
                    noteText: '✅ Order completed! Your registration has been approved.'
                };
            }
            
            if (status === 'rejected') {
                return {
                    badge: 'Rejected',
                    badgeClass: 'status-rejected',
                    noteClass: 'rejected',
                    noteText: '❌ Registration rejected. Please contact support for assistance.'
                };
            }
            
            if (status === 'failed') {
                return {
                    badge: 'Payment Failed',
                    badgeClass: 'status-failed',
                    noteClass: 'failed',
                    noteText: '⚠️ Payment failed or was not completed. Use Proceed to Payment to try again.'
                };
            }
            
            if (status === 'paid') {
                return {
                    badge: 'Pending Approval',
                    badgeClass: 'status-paid',
                    noteClass: 'paid',
                    noteText: '💳 Payment received and verified. Awaiting AFA approval...'
                };
            }
            
            // pending
            return {
                badge: 'Pending',
                badgeClass: 'status-pending',
                noteClass: 'pending',
                noteText: '⏳ Waiting for payment completion...'
            };
        }

        // ============================================
        // STATS TRACKING
        // ============================================
        let totalCount = 0;
        let pendingCount = 0;
        let approvedCount = 0;
        let allOrders = [];
        let isRefreshingOrders = false;

        // ============================================
        // FIXED: MAIN INIT with async auth
        // ============================================
        async function initOrders() {

            // Safety timeout - if loading takes more than 10 seconds, show error
            const loadingTimeout = setTimeout(() => {
                const ordersList = document.getElementById('ordersList');
                if (ordersList && ordersList.innerHTML.includes('Loading your orders')) {
                    ordersList.innerHTML = `
                        <div class="empty-state">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                            </svg>
                            <p>Loading timed out. Please check your connection and try again.</p>
                            <button onclick="initOrders()" style="margin-top:16px;padding:10px 20px;background:var(--primary-yellow);border:none;border-radius:var(--radius-sm);color:var(--text-dark);font-weight:700;cursor:pointer;">Retry</button>
                        </div>
                    `;
                }
            }, 10000);
            const authValid = await isAuthenticatedOrders();
            if (!authValid) {
                if (typeof clearSession === 'function') clearSession();
                window.location.href = 'signin.html';
                return;
            }
            const user = getUserUnified();
            
            try {
                const data = await apiCallOrders('/api/user/orders', 'POST', { userId: user.id });
                
                if (!data.success) {
                    if (data.error && (data.error.includes('token') || data.error.includes('Access denied') || data.error.includes('Invalid or expired'))) {
                        if (typeof clearSession === 'function') clearSession();
                        window.location.href = 'signin.html';
                        return;
                    }
                    throw new Error(data.error || 'Failed to load orders');
                }
                
                if (data.orders) localStorage.setItem('cachedOrders', JSON.stringify(data.orders));
                
                allOrders = data.orders || [];
                renderOrders(allOrders);
                clearTimeout(loadingTimeout);
                
            } catch (error) {
                console.error('initOrders ERROR:', error);

                // ALWAYS show cached orders if available, regardless of error
                const cachedOrders = localStorage.getItem('cachedOrders');
                if (cachedOrders) {
                    try {
                        const orders = JSON.parse(cachedOrders);
                        showToast('Showing cached orders', 'error');
                        renderOrders(orders);

                        // If auth error, redirect after showing cached data
                        if (error.message && (error.message.includes('Session expired') || error.message.includes('token') || error.message.includes('unauthorized') || error.message.includes('Access denied'))) {
                            setTimeout(() => {
                                if (typeof clearSession === 'function') clearSession();
                                window.location.href = 'signin.html';
                            }, 2000);
                        }
                        return;
                    } catch (e) {}
                }

                // If auth error and no cached orders, redirect immediately
                if (error.message && (error.message.includes('Session expired') || error.message.includes('token') || error.message.includes('unauthorized') || error.message.includes('Access denied'))) {
                    if (typeof clearSession === 'function') clearSession();
                    window.location.href = 'signin.html';
                    return;
                }

                // Show error with retry button
                document.getElementById('ordersList').innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                        </svg>
                        <p>Error loading orders: ${escapeHtml(error.message || 'Unknown error')}</p>
                        <button onclick="initOrders()" style="margin-top:16px;padding:10px 20px;background:var(--primary-yellow);border:none;border-radius:var(--radius-sm);color:var(--text-dark);font-weight:700;cursor:pointer;">Retry</button>
                    </div>
                `;
            }
        }

        function applyOrderFilters() {
            const query = (document.getElementById('orderSearch')?.value || '').trim().toLowerCase();
            const filter = document.getElementById('orderFilter')?.value || 'all';
            const filtered = allOrders.filter(order => {
                const matchesText = !query || [order.applicant_name, order.applicant_phone, order.payment_reference, order.id].some(value => String(value || '').toLowerCase().includes(query));
                const matchesStatus = filter === 'all' || (order.status || 'pending') === filter;
                return matchesText && matchesStatus;
            });
            renderOrders(filtered, true);
        }

        async function refreshOrders() {
            if (isRefreshingOrders) return;
            isRefreshingOrders = true;
            const button = document.querySelector('button[onclick="refreshOrders()"]');
            if (button) { button.disabled = true; button.textContent = 'Refreshing...'; }
            try { await initOrders(); showToast('Order status refreshed', 'success'); } finally {
                isRefreshingOrders = false;
                if (button) { button.disabled = false; button.textContent = 'Refresh Status'; }
            }
        }

        // ============================================
        // PAGE VISIBILITY REFRESH
        // ============================================
        
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                if (isRefreshingOrders) return;
                isRefreshingOrders = true;
                try {
                    await initOrders();
                } catch (err) {} finally {
                    isRefreshingOrders = false;
                }
            }
        });

        // ============================================
        function getStatusExplanation(status) {
            if (status === 'paid') return 'Payment has been verified. Your registration is waiting for the administrator to complete approval.';
            if (status === 'approved') return 'Payment was verified and your registration has been approved.';
            if (status === 'failed' || status === 'rejected') return 'This payment did not complete. Use Proceed to Payment on this order to try again instead of creating a duplicate order.';
            return 'Your order is recorded and is waiting for payment confirmation. Complete payment or use Proceed to Payment to continue.';
        }

        async function copyPaymentReference(reference, button) {
            if (!reference || reference === 'N/A') return;
            try {
                if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(reference);
                else {
                    const helper = document.createElement('textarea');
                    helper.value = reference;
                    helper.style.position = 'fixed';
                    helper.style.opacity = '0';
                    document.body.appendChild(helper);
                    helper.select();
                    document.execCommand('copy');
                    helper.remove();
                }
                const original = button?.textContent || 'Copy';
                if (button) { button.textContent = 'Copied'; button.disabled = true; setTimeout(() => { button.textContent = original; button.disabled = false; }, 1500); }
                showToast('Payment reference copied', 'success');
            } catch (error) {
                showToast('Could not copy the payment reference', 'error');
            }
        }

        // RENDER ORDERS
        // ============================================
        function renderOrders(orders, preserveFilters = false) {
            const container = document.getElementById('ordersList');
            totalCount = orders.length;
            pendingCount = 0;
            approvedCount = 0;
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                        </svg>
                        <p>No orders yet. Submit your first AFA registration.</p>
                    </div>`;
                updateStats();
                return;
            }
            
            let html = '';
            for (const order of orders) {
                const displayStatus = getOrderDisplayStatus(order);
                
                const status = order.status || 'pending';
                
                if (status === 'approved') {
                    approvedCount++;
                } else if (status === 'pending' || status === 'paid') {
                    pendingCount++;
                }
                
                const date = order.created_at 
                    ? new Date(order.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) 
                    : 'Just now';
                
                const orderId = order.id ? order.id.toString().substr(-8).toUpperCase() : 'N/A';
                
                const safeName = escapeHtml(order.applicant_name || 'N/A');
                const safePhone = escapeHtml(order.applicant_phone || 'N/A');
                const rawRef = String(order.payment_reference || 'N/A');
                const safeRef = escapeHtml(rawRef);
                const jsRef = rawRef.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
                const safeNoteText = escapeHtml(displayStatus.noteText);
                const safeStatusExplanation = escapeHtml(getStatusExplanation(status));
                const canRetryPayment = status === 'pending' || status === 'failed';
                const retryPaymentButton = canRetryPayment
                    ? `<button type="button" onclick="proceedToPayment('${String(order.id).replace(/'/g, "\\'")}', this)" style="width:100%;margin-top:12px;padding:12px;background:linear-gradient(135deg,#FFD700,#FFA500);border:none;border-radius:var(--radius-sm);color:#1a1a1a;font-weight:800;cursor:pointer;">Proceed to Payment</button>`
                    : '';
                
                const displayAmount = 15.45;
                
                let adminNoteHtml = `<div class="admin-note ${displayStatus.noteClass}">${safeNoteText}</div>`;
                
                if (order.admin_note && order.admin_note.trim()) {
                    const safeAdminNote = escapeHtml(order.admin_note);
                    adminNoteHtml += `<div class="admin-note" style="margin-top:8px;background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.1);color:var(--text-muted);">
                         <strong>MTN AFA NOTE:</strong> ${safeAdminNote}
                    </div>`;
                }
                
                html += `
                    <div class="order-card" id="order-card-${order.id}">
                        <div class="order-header">
                            <span class="order-id">#${orderId}</span>
                            <span class="order-status ${displayStatus.badgeClass}">${displayStatus.badge}</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;gap:4px;margin:14px 0 16px;font-size:10px;font-weight:700;color:var(--text-muted);">
                            <span style="color:${status === 'pending' ? 'var(--primary-yellow)' : 'var(--text-muted)'};">Payment</span><span>Verified</span><span style="color:${status === 'approved' ? 'var(--accent-green)' : 'var(--text-muted)'};">Approved</span>
                        </div>
                        <div class="order-details">
                            <div class="detail-row">
                                <span class="detail-label">Applicant</span>
                                <span class="detail-value">${safeName}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Phone</span>
                                <span class="detail-value">${safePhone}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Amount</span>
                                <span class="detail-value">GH₵ ${displayAmount.toFixed(2)}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Payment Ref</span>
                                <span class="detail-value" style="font-size: 11px;word-break:break-all;">${safeRef}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Date</span>
                                <span class="detail-value">${date}</span>
                            </div>
                        </div>
                        ${adminNoteHtml}
                        <details style="margin-top:12px;border-top:1px solid var(--glass-border);padding-top:10px;">
                            <summary style="cursor:pointer;color:var(--primary-yellow);font-size:13px;font-weight:700;">What does this status mean?</summary>
                            <p style="margin-top:8px;color:var(--text-secondary);font-size:12px;line-height:1.5;">${safeStatusExplanation}</p>
                        </details>
                        ${rawRef !== 'N/A' ? `<button type="button" onclick="copyPaymentReference('${jsRef}', this)" style="width:100%;margin-top:12px;padding:11px;background:rgba(255,215,0,.10);border:1px solid rgba(255,215,0,.35);border-radius:var(--radius-sm);color:var(--primary-yellow);font-weight:700;cursor:pointer;">Copy Payment Reference</button>` : ''}
                        ${retryPaymentButton}
                        <button type="button" onclick="openOrderEditModal('${String(order.id).replace(/'/g, "\\'")}')" style="width:100%;margin-top:12px;padding:12px;background:linear-gradient(135deg,#FFD700,#FFA500);border:none;border-radius:var(--radius-sm);color:#1a1a1a;font-weight:800;cursor:pointer;">✎ Edit Registration</button>
                        <button class="btn-delete-order" id="delete-btn-${order.id}" onclick="deleteUserOrder('${order.id}')">
                            🗑 Delete
                        </button>
                    </div>
                `;
            }
            
            container.innerHTML = html;
            updateStats();
            autoSendSMSForPaidOrders(); // ← AUTO-SMS: Send SMS for paid orders
        }

        

        // ============================================
        // AUTO-SMS: Send SMS for paid orders that haven't sent SMS yet
        // ============================================
        async function autoSendSMSForPaidOrders() {
            // Get current orders from the page or localStorage
            let currentOrders = [];
            const cachedOrders = localStorage.getItem('cachedOrders');
            if (cachedOrders) {
                try { currentOrders = JSON.parse(cachedOrders); } catch (e) {}
            }

            const paidOrders = currentOrders.filter(o => 
                (o.status === 'paid' || o.status === 'approved') && 
                o.sms_sent !== true && 
                o.sms_sent !== 'true'
            );

            if (paidOrders.length === 0) return;

            console.log(`[AUTO-SMS-ORDERS] Found ${paidOrders.length} paid orders without SMS`);

            for (const order of paidOrders) {
                try {
                    const data = await apiCallOrders('/api/send-sms', 'POST', { orderId: order.id });
                    if (data.success) {
                        console.log(`[AUTO-SMS-ORDERS] SMS sent for order ${order.id}`);
                        showToast('Admin notified of your payment!', 'success');
                    } else {
                        console.log(`[AUTO-SMS-ORDERS] SMS failed for order ${order.id}:`, data.message);
                    }
                } catch (e) {
                    console.error(`[AUTO-SMS-ORDERS] Error for order ${order.id}:`, e.message);
                }
            }
        }
function updateStats() {
            document.getElementById('totalOrders').textContent = totalCount;
            document.getElementById('pendingOrders').textContent = pendingCount;
            document.getElementById('approvedOrders').textContent = approvedCount;
        }

        // ============================================
        // XSS HELPER
        // ============================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // START ON PAGE LOAD
        // ============================================
        document.addEventListener('DOMContentLoaded', initOrders);

        // Header scroll effect
        window.addEventListener('scroll', () => {
            const header = document.getElementById('ordersHeader');
            if (window.scrollY > 10) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
