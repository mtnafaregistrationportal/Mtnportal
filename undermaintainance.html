<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0f1a">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <title>Under Maintenance - MTN AFA Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --yellow: #ffc400;
            --yellow-bright: #ffd21a;
            --page-start: #08090d;
            --page-end: #11131d;
            --card: rgba(31, 33, 51, 0.82);
            --card-inner: rgba(45, 48, 72, 0.58);
            --border: rgba(151, 162, 201, 0.25);
            --text: #ffffff;
            --muted: #a7acc3;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0;
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 24px;
            overflow-x: hidden;
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 50% 14%, rgba(255, 196, 0, 0.08), transparent 24%),
                radial-gradient(circle at 10% 90%, rgba(80, 100, 180, 0.08), transparent 34%),
                linear-gradient(145deg, var(--page-start), var(--page-end));
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.3) 100%);
        }

        .maintenance-card {
            position: relative;
            z-index: 1;
            width: min(100%, 764px);
            padding: 48px 48px 50px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 38px;
            background: var(--card);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(28px) saturate(150%);
            -webkit-backdrop-filter: blur(28px) saturate(150%);
            animation: card-in 0.55s ease-out both;
        }

        .status-icon {
            display: grid;
            place-items: center;
            width: 160px;
            height: 160px;
            margin: 0 auto 40px;
            border: 4px solid var(--yellow);
            border-radius: 50%;
            color: var(--yellow);
            box-shadow: 0 0 24px rgba(255, 196, 0, 0.08);
        }

        .status-icon svg { width: 88px; height: 88px; }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.15;
            letter-spacing: -1.5px;
            font-weight: 800;
        }

        .message-card {
            margin: 26px 0 34px;
            padding: 39px 40px 42px;
            text-align: left;
            border: 1px solid rgba(133, 142, 180, 0.13);
            border-radius: 28px;
            background: var(--card-inner);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
        }

        .message-card p {
            margin: 0;
            font-size: clamp(1.22rem, 3vw, 1.72rem);
            line-height: 1.7;
            font-weight: 600;
            letter-spacing: 0.1px;
        }

        .message-card p + p { margin-top: 25px; }

        .dashboard-button {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 82px;
            width: 100%;
            padding: 18px 24px;
            border: 0;
            border-radius: 24px;
            color: #050505;
            background: linear-gradient(135deg, var(--yellow-bright), #ffb900);
            box-shadow: 0 9px 24px rgba(255, 196, 0, 0.2);
            font: inherit;
            font-size: clamp(1.12rem, 3vw, 1.55rem);
            font-weight: 800;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        .dashboard-button:hover, .dashboard-button:focus-visible {
            filter: brightness(1.05);
            transform: translateY(-2px);
            box-shadow: 0 13px 30px rgba(255, 196, 0, 0.3);
            outline: none;
        }

        .dashboard-button:active { transform: translateY(0); }

        .dashboard-button svg { width: 30px; height: 30px; margin-right: 13px; }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(18px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 600px) {
            body { padding: 16px; }
            .maintenance-card { padding: 38px 18px 24px; border-radius: 30px; }
            .status-icon { width: 118px; height: 118px; margin-bottom: 28px; }
            .status-icon svg { width: 66px; height: 66px; }
            .message-card { padding: 24px 22px 28px; margin: 22px 0 24px; border-radius: 22px; }
            .message-card p { line-height: 1.55; }
            .message-card p + p { margin-top: 18px; }
            .dashboard-button { min-height: 66px; border-radius: 18px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="maintenance-card" aria-labelledby="maintenance-title">
        <div class="status-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a4.5 4.5 0 0 0 5.48 5.48l-5.37 5.37a2.25 2.25 0 0 1-3.18-3.18L17 8.6a4.5 4.5 0 0 0-2.3-2.3Z" />
                <path d="m5.2 18.8-.01.01" />
                <path d="M6.5 17.5 4.8 19.2" />
                <circle cx="5.2" cy="18.8" r="1.1" fill="currentColor" stroke="none" />
            </svg>
        </div>

        <h1 id="maintenance-title">Under Maintenance</h1>

        <section class="message-card" aria-label="Maintenance message">
            <p>We're currently upgrading our registration system to serve you better.</p>
            <p>Please check back soon!</p>
        </section>

        <a class="dashboard-button" href="dashboard.html">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M3.5 11.2 20.8 3.6c.8-.35 1.6.43 1.25 1.23l-7.6 17.3c-.32.74-1.4.72-1.69-.04l-2.16-5.57-5.57-2.16c-.76-.29-.78-1.36-.04-1.69Zm4.08 1.98 4.02 1.56 1.56 4.02 5.63-12.8-11.21 7.22Z" />
            </svg>
            Go to Dashboard
        </a>
    </main>
</body>
</html>
