<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MTN AFA Portal - Unavailable</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-yellow: #FFD700;
            --primary-yellow-glow: rgba(255, 215, 0, 0.3);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.65);
            --text-muted: rgba(255, 255, 255, 0.45);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.18);
            --glass-highlight: rgba(255, 255, 255, 0.25);
            --bg-gradient-start: #0a0f1a;
            --bg-gradient-mid: #0d1b2a;
            --bg-gradient-end: #0a1520;
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

        html, body {
            width: 100%;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(160deg, var(--bg-gradient-start) 0%, var(--bg-gradient-mid) 40%, var(--bg-gradient-end) 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(255, 215, 0, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(90, 200, 250, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(175, 82, 222, 0.02) 0%, transparent 50%);
            animation: meshMove 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes meshMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, 2%) rotate(1deg); }
            66% { transform: translate(-1%, 1%) rotate(-1deg); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 var(--primary-yellow-glow); }
            50% { box-shadow: 0 0 20px 4px var(--primary-yellow-glow); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 16px;
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Back Button */
        .page-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            padding-top: 16px;
            animation: fadeInUp 0.5s var(--transition-smooth);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all var(--transition-fast);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            cursor: pointer;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            color: var(--primary-yellow);
            transform: translateX(-2px);
        }

        .back-btn:active {
            transform: translateX(0) scale(0.97);
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Main Content */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
            animation: fadeInUp 0.6s var(--transition-smooth) 0.1s backwards;
        }

        /* Maintenance Icon */
        .icon-wrapper {
            width: 100px;
            height: 100px;
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 28px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 var(--glass-highlight);
            animation: float 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .icon-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-highlight), transparent);
            opacity: 0.6;
        }

        .icon-wrapper svg {
            width: 48px;
            height: 48px;
            color: var(--primary-yellow);
        }

        /* Title */
        .title {
            font-size: 28px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.15);
        }

        /* Subtitle */
        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 32px;
            max-width: 320px;
        }

        /* Status Card */
        .status-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px) saturate(180%);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            margin-bottom: 32px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.15), inset 0 1px 0 var(--glass-highlight);
            width: 100%;
            max-width: 340px;
            animation: scaleIn 0.5s var(--transition-smooth) 0.2s backwards;
            position: relative;
            overflow: hidden;
        }

        .status-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--glass-highlight), transparent);
            opacity: 0.6;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-label {
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
        }

        .status-value {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-yellow);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-yellow);
            animation: pulse-glow 2s ease-in-out infinite;
        }

        /* CTA Button */
        .cta-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--primary-yellow), #FFA500);
            color: #1a1a1a;
            font-size: 15px;
            font-weight: 700;
            padding: 14px 32px;
            border-radius: var(--radius-full);
            border: none;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.35);
            transition: all var(--transition-fast);
            letter-spacing: 0.3px;
            animation: fadeInUp 0.5s var(--transition-smooth) 0.3s backwards, pulse-glow 2s ease-in-out infinite;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(255, 215, 0, 0.5);
        }

        .cta-btn:active {
            transform: translateY(0) scale(0.97);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 16px 20px;
            font-size: 12px;
            color: var(--text-muted);
            animation: fadeInUp 0.5s var(--transition-smooth) 0.4s backwards;
        }

        @media (min-width: 600px) {
            .container { padding: 20px 32px; }
            .page-header { padding-top: 20px; }
            .title { font-size: 36px; }
            .subtitle { font-size: 16px; max-width: 380px; }
            .icon-wrapper { width: 120px; height: 120px; }
            .icon-wrapper svg { width: 56px; height: 56px; }
            .status-card { padding: 24px 28px; max-width: 380px; }
            .cta-btn { font-size: 16px; padding: 16px 36px; }
        }

        @media (min-width: 1024px) {
            .container { padding: 24px 48px; }
            .title { font-size: 42px; }
            .subtitle { font-size: 17px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <a href="dashboard.html" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
                Back
            </a>
        </div>

        <div class="content">
            <div class="icon-wrapper">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 004.486-6.336l-3.276 3.277a3.004 3.004 0 01-2.25-2.25l3.276-3.276a4.5 4.5 0 00-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437l1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008z" />
                </svg>
            </div>

            <h1 class="title">Registration Unavailable</h1>
            <p class="subtitle">We're currently upgrading our registration system to serve you better. Please check back soon!</p>

            <div class="status-card">
                <div class="status-row">
                    <span class="status-label">Service Status</span>
                    <span class="status-value">
                        <span class="status-dot"></span>
                        Under Maintenance
                    </span>
                </div>
                <div class="status-row">
                    <span class="status-label">Estimated Return</span>
                    <span class="status-value">Soon</span>
                </div>
            </div>

            <a href="dashboard.html" class="cta-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 18px; height: 18px;">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                Go to Dashboard
            </a>
        </div>

        <footer class="footer">
            &copy; MTN Ghana. All rights reserved.
        </footer>
    </div>
</body>
</html>
